
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HTMX Basics</title>

  <!-- HTMX can be loaded via CDN or downloaded as a copy into your project! -->
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js" integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="../static/css/styles.css">
</head>
<body>
    <h1>HTMX Demo!!!!!!!</h1>

    <div class="container">
        <h2>Click the button!</h2>

        <!-- Bare bones example: When a user clicks the button, send AJAX request to /clicked and swap HTML inside #hello div -->
        <!-- hx-get: Issues an AJAX GET request to the given URL -->
        <!-- hx-target: Allows a response to be loaded in a different element than the one that made the request, accepts all standard CSS selectors-->
        <!-- hx-indicator: Acts like a spinner (showing chosen element when request is in prorgess) when an AJAX request is made. I just found it fun -->
        <!-- hx-swap: How the returned HTML is inserted. innerHTML is the default value, replacing what's already inside <div id='hello'> -->
        <button hx-get="/clicked" hx-target="#hello" hx-indicator="#loadloadload" hx-swap="innerHTML">Right here buddy</button>
        
        <!-- class="htmx-indicator" keeps this hidden until a request is running. htmx's built-in CSS fades it in and out -->
        <span id="loadloadload" class="htmx-indicator">Loading.......</span>
        <div id="hello"><br>And for my next magic trick, this text will dissappear!</div>
    </div>

    <line></line>

    <div class="container">
        <h2>Slop Search</h2>

        <!-- hx-get: Sends a GET request to /search. -->
        <!-- hx-trigger: When to send the request. -->
        <!-- https://htmx.org/docs/#triggers -->
        <!-- "input changed delay:0.35s" = search results automatically pop up 300ms after user stops typing -->
        <!-- https://htmx.org/docs/#trigger-modifiers -->
        <!--  removing it would mean a user would have to press 'enter' for the search results to display y'know?-->
        <input type="search" name="slop" placeholder="Search slop here..."
                hx-get="/search"
                hx-trigger="input changed delay:0.35s"
                hx-target="#results">
    
        <ul id="results"></ul>
    </div>

    <div class="container">
        <h2>Add n Delete</h2>

        <!-- hx-post: Sends the form to /yaplist as an AJAX POST -->
        <!-- hx-target: What Flask returns will go into <ul id="display-list"> -->
        <!-- hx-swap="beforeend": Add it to the end of the list. innerHTML would wipe out the existing items -->
        <!-- https://htmx.org/docs/#swapping -->
        <!-- hx-on::after-request: Runs a bit of JavaScript when the request finishes. this.reset() clears the form -->
        <!-- https://htmx.org/examples/reset-user-input/ -->
        <form hx-post="/yaplist" hx-target="#display-list" hx-swap="beforeend" hx-on::after-request="this.reset()">
            <input name="text" placeholder="Yap away bud" required>
            <button>Add</button>
        </form>

        
        <!-- | safe tells Jinja to insert it as real HTML instead of straight up text -->
        <!-- not part of the tech share, but necessary if writing up HTML from Flask-->
        <!--https://jinja.app/documentation/jinja-filters/jinja-safe-filter-function-to-disable-html-escaping -->
        <ul id="display-list">{{ yap_html | safe }}</ul>
    </div>

</body>
</html>
